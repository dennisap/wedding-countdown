<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitung Mundur Pernikahan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf5ef;
      --bg-accent: #f1e4d6;
      --card: #ffffff;
      --text: #3d2f2a;
      --muted: #8a756b;
      --gold: #b08a4f;
      --line: #e6d8c8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, var(--bg-accent) 0, transparent 45%),
        radial-gradient(circle at 85% 90%, var(--bg-accent) 0, transparent 45%),
        var(--bg);
    }

    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .names {
      margin: 18px 0 10px;
      font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif;
      font-size: clamp(44px, 11vw, 84px);
      font-weight: 400;
      line-height: 1.15;
      color: var(--gold);
      overflow-wrap: anywhere;
    }

    .names .amp {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.5em;
      color: var(--muted);
      padding: 0 0.25em;
    }

    .divider {
      width: 80px;
      height: 1px;
      margin: 18px auto;
      background: var(--gold);
      position: relative;
    }

    .divider::after {
      content: "♥";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0 10px;
      font-size: 12px;
      color: var(--gold);
      background: var(--bg);
    }

    .when {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(18px, 4.5vw, 24px);
    }

    .where {
      margin-top: 4px;
      font-size: 14px;
      color: var(--muted);
    }

    .status {
      margin: 32px 0 14px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: var(--muted);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .unit {
      padding: 20px 4px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(120, 90, 60, 0.07);
    }

    .unit .num {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(32px, 9vw, 60px);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit .label {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    button:hover { border-color: var(--gold); }

    button.primary {
      color: #fff;
      background: var(--gold);
      border-color: var(--gold);
    }

    button.primary:hover { background: #9a7740; }

    dialog {
      width: min(420px, calc(100vw - 32px));
      margin: auto;
      padding: 24px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    dialog::backdrop { background: rgba(61, 47, 42, 0.45); }

    dialog h2 {
      margin-bottom: 16px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 26px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: left;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

    .form-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .music-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--gold);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 6px 20px rgba(120, 90, 60, 0.12);
    }

    .music-toggle svg { transition: opacity 0.15s; }
    .music-toggle:not(.playing) svg { opacity: 0.4; }
    .music-toggle.playing svg { animation: spin 5s linear infinite; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      .countdown { gap: 8px; }
      .unit { padding: 16px 2px 12px; border-radius: 10px; }
      .unit .label { font-size: 9px; letter-spacing: 0.12em; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The Wedding of</p>
    <h1 class="names">
      <span id="nameA">Mempelai Pria</span><span class="amp">&amp;</span><span id="nameB">Mempelai Wanita</span>
    </h1>
    <div class="divider"></div>
    <p class="when" id="when">Tanggal belum diatur</p>
    <p class="where" id="where"></p>

    <p class="status" id="status">Atur tanggal pernikahan untuk memulai</p>
    <div class="countdown">
      <div class="unit"><div class="num" id="days">--</div><div class="label">Hari</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">Jam</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">Menit</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">Detik</div></div>
    </div>

    <div class="actions">
      <button id="openSettings">Atur Acara</button>
      <button id="share">Salin Tautan</button>
    </div>
  </main>

  <dialog id="settings">
    <form id="form" method="dialog">
      <h2>Atur Acara</h2>
      <label>Nama mempelai pria
        <input name="a" maxlength="40" required>
      </label>
      <label>Nama mempelai wanita
        <input name="b" maxlength="40" required>
      </label>
      <label>Tanggal &amp; waktu acara
        <input name="date" type="datetime-local" required>
      </label>
      <label>Lokasi (opsional)
        <input name="place" maxlength="80">
      </label>
      <div class="form-actions">
        <button type="button" id="cancel">Batal</button>
        <button type="submit" class="primary">Simpan</button>
      </div>
    </form>
  </dialog>

  <audio id="bgm" src="pilihanku.mp3" loop preload="auto"></audio>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Putar musik" title="Pilihanku — Maliq & D'Essentials">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <script>
    const STORAGE_KEY = "wedding-countdown";
    const $ = (id) => document.getElementById(id);
    const dialog = $("settings");
    const form = $("form");

    // Data dari tautan (?a=&b=&d=&p=) lebih diutamakan daripada yang tersimpan
    function loadEvent() {
      const params = new URLSearchParams(location.search);
      if (params.get("d")) {
        return {
          a: params.get("a") || "",
          b: params.get("b") || "",
          date: params.get("d"),
          place: params.get("p") || "",
        };
      }
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
      } catch {
        return null;
      }
    }

    function saveEvent(event) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(event));
      } catch {}
    }

    let event = loadEvent();
    let target = null;

    function renderEvent() {
      if (!event) return;
      target = new Date(event.date);
      if (isNaN(target)) {
        target = null;
        return;
      }
      $("nameA").textContent = event.a || "Mempelai Pria";
      $("nameB").textContent = event.b || "Mempelai Wanita";
      const tanggal = target.toLocaleDateString("id-ID", {
        weekday: "long", day: "numeric", month: "long", year: "numeric",
      });
      const jam = target.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      $("when").textContent = `${tanggal} · ${jam}`;
      $("where").textContent = event.place || "";
      document.title = `${event.a} & ${event.b} — Hitung Mundur`;
      tick();
    }

    const pad = (n) => String(n).padStart(2, "0");

    function tick() {
      if (!target) return;
      const diff = target - Date.now();
      const passed = diff <= 0;
      const total = Math.floor(Math.abs(diff) / 1000);

      $("days").textContent = Math.floor(total / 86400);
      $("hours").textContent = pad(Math.floor((total % 86400) / 3600));
      $("minutes").textContent = pad(Math.floor((total % 3600) / 60));
      $("seconds").textContent = pad(total % 60);
      $("status").textContent = passed
        ? "Selamat menempuh hidup baru! Sudah bersama selama"
        : "Menuju hari bahagia";
    }

    function openSettings() {
      form.a.value = event?.a || "";
      form.b.value = event?.b || "";
      form.date.value = event?.date || "";
      form.place.value = event?.place || "";
      dialog.showModal();
    }

    form.addEventListener("submit", () => {
      event = {
        a: form.a.value.trim(),
        b: form.b.value.trim(),
        date: form.date.value,
        place: form.place.value.trim(),
      };
      saveEvent(event);
      // Buang parameter tautan lama supaya tidak menimpa data yang baru disimpan
      history.replaceState(null, "", location.pathname);
      renderEvent();
    });

    $("openSettings").addEventListener("click", openSettings);
    $("cancel").addEventListener("click", () => dialog.close());

    $("share").addEventListener("click", async () => {
      if (!event) return openSettings();
      const params = new URLSearchParams({ a: event.a, b: event.b, d: event.date });
      if (event.place) params.set("p", event.place);
      const url = `${location.href.split(/[?#]/)[0]}?${params}`;
      const button = $("share");
      try {
        await navigator.clipboard.writeText(url);
        button.textContent = "Tautan tersalin ✓";
      } catch {
        button.textContent = "Gagal menyalin";
      }
      setTimeout(() => (button.textContent = "Salin Tautan"), 2000);
    });

    const bgm = $("bgm");
    const musicToggle = $("musicToggle");

    function setMusicUI(playing) {
      musicToggle.classList.toggle("playing", playing);
      musicToggle.setAttribute("aria-label", playing ? "Jeda musik" : "Putar musik");
    }

    async function tryPlayMusic() {
      try {
        await bgm.play();
        setMusicUI(true);
      } catch {
        setMusicUI(false);
      }
    }

    musicToggle.addEventListener("click", () => {
      if (bgm.paused) tryPlayMusic();
      else {
        bgm.pause();
        setMusicUI(false);
      }
    });

    tryPlayMusic();
    document.addEventListener("click", function startMusic() {
      if (bgm.paused) tryPlayMusic();
      document.removeEventListener("click", startMusic);
    });

    renderEvent();
    setInterval(tick, 1000);
    if (!target) openSettings();
  </script>
</body>
</html>
